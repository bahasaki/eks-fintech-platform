name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/build-and-push.yml'

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 774493573578.dkr.ecr.us-east-1.amazonaws.com

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      any-changed: ${{ steps.set-matrix.outputs.any-changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            accounts:
              - 'services/accounts/**'
            transactions:
              - 'services/transactions/**'
            api-gateway:
              - 'services/api-gateway/**'

      - name: Build matrix of changed services
        id: set-matrix
        run: |
          services="[]"
          if [ "${{ steps.filter.outputs.accounts }}" == "true" ]; then
            services=$(echo "$services" | jq -c '. += ["accounts"]')
          fi
          if [ "${{ steps.filter.outputs.transactions }}" == "true" ]; then
            services=$(echo "$services" | jq -c '. += ["transactions"]')
          fi
          if [ "${{ steps.filter.outputs.api-gateway }}" == "true" ]; then
            services=$(echo "$services" | jq -c '. += ["api-gateway"]')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          if [ "$services" == "[]" ]; then
            echo "any-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any-changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed services: $services"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::774493573578:role/eks-fintech-github-actions-ecr-push-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service }}-service:$IMAGE_TAG \
                        -t $ECR_REGISTRY/${{ matrix.service }}-service:latest \
                        services/${{ matrix.service }}/
          docker push $ECR_REGISTRY/${{ matrix.service }}-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.service }}-service:latest

      - name: Sync with latest main before editing manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Update Kubernetes manifest with new image tag
        run: |
          sed -i "s|image: .*${{ matrix.service }}-service:.*|image: ${ECR_REGISTRY}/${{ matrix.service }}-service:${{ github.sha }}|" \
            kubernetes/${{ matrix.service }}/deployment.yaml

      - name: Commit updated manifest
        run: |
          git add kubernetes/${{ matrix.service }}/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update ${{ matrix.service }} image to ${{ github.sha }} [skip ci]"
          git push
