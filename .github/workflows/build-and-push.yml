name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/build-and-push.yml'

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 774493573578.dkr.ecr.us-east-1.amazonaws.com

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.filter.outputs.accounts }}
      transactions: ${{ steps.filter.outputs.transactions }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            accounts:
              - 'services/accounts/**'
            transactions:
              - 'services/transactions/**'
            api-gateway:
              - 'services/api-gateway/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.accounts == 'true' || needs.detect-changes.outputs.transactions == 'true' || needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [accounts, transactions, api-gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if this service changed
        id: check
        run: |
          if [ "${{ matrix.service }}" == "accounts" ] && [ "${{ needs.detect-changes.outputs.accounts }}" != "true" ]; then echo "skip=true" >> $GITHUB_OUTPUT; fi
          if [ "${{ matrix.service }}" == "transactions" ] && [ "${{ needs.detect-changes.outputs.transactions }}" != "true" ]; then echo "skip=true" >> $GITHUB_OUTPUT; fi
          if [ "${{ matrix.service }}" == "api-gateway" ] && [ "${{ needs.detect-changes.outputs.api-gateway }}" != "true" ]; then echo "skip=true" >> $GITHUB_OUTPUT; fi

      - name: Configure AWS credentials via OIDC
        if: steps.check.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::774493573578:role/eks-fintech-github-actions-ecr-push-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.check.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.check.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service }}-service:$IMAGE_TAG \
                        -t $ECR_REGISTRY/${{ matrix.service }}-service:latest \
                        services/${{ matrix.service }}/
          docker push $ECR_REGISTRY/${{ matrix.service }}-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.service }}-service:latest

      - name: Update Kubernetes manifest with new image tag
        if: steps.check.outputs.skip != 'true'
        run: |
          sed -i "s|image: .*${{ matrix.service }}-service:.*|image: ${ECR_REGISTRY}/${{ matrix.service }}-service:${{ github.sha }}|" \
            kubernetes/${{ matrix.service }}/deployment.yaml

      - name: Commit updated manifest
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/${{ matrix.service }}/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update ${{ matrix.service }} image to ${{ github.sha }} [skip ci]"
          git push